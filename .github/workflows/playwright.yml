name: Playwright Tests # Workflow Name
on: # Trigger the workflow on push or pull request to main or master branches
  push: # Trigger on push to main or master branches
    branches: [main, master]
  pull_request: # Trigger on pull request to main or master branches
    branches: [main, master]
jobs: # Define the jobs to run in this workflow
  test:
    timeout-minutes: 60 # Set a timeout for the job - If the job takes longer than this, it will be cancelled
    runs-on: ubuntu-latest # Specify the environment to run the job on. windows-latest, macos-latest, or ubuntu-latest
    steps:  # Define the steps to run in this job
      - uses: actions/checkout@v4 # Checkout the repository code
      - uses: actions/setup-node@v4 # Set up Node.js environment
        with:
          node-version: lts/* # Use the latest LTS version of Node.js
      - name: Install dependencies # Install project dependencies (This is just a title for the step)
        run: npm ci # Install dependencies using npm ci. "ci" is used for continuous integration environments
      - name: Install Playwright Browsers # TITLE: Install Playwright Browsers
        run: npx playwright install --with-deps # Install Playwright browsers with their dependencies
      - name: Run Playwright tests # TITLE: Run Playwright tests
        run: npx playwright test # Execute Playwright tests using the npx command
      - uses: actions/upload-artifact@v4 # Upload the test report as an artifact
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
